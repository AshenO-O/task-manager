services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: taskmanager-mongodb
    restart: always
    ports:
      - "27018:27017"  # Use different port to avoid conflict with local MongoDB
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: taskmanager
    networks:
      - taskmanager-network

  # Spring Boot Backend
  backend:
    build: ./backend
    container_name: taskmanager-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/taskmanager
      - JWT_SECRET=your-super-secret-key-change-this-in-production
    networks:
      - taskmanager-network

  # React Frontend
  frontend:
    build: ./frontend
    container_name: taskmanager-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - taskmanager-network

volumes:
  mongodb_data:

networks:
  taskmanager-network:
    driver: bridge