# Server configuration
server.port=8080

# MongoDB configuration - This will work both locally and in Docker
# Docker uses: mongodb://mongodb:27017/taskmanager
# Local uses: mongodb://localhost:27017/taskmanager
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/taskmanager}

# JWT Secret (use environment variable in production)
jwt.secret=${JWT_SECRET:your-super-secret-key-change-this-in-production}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.taskmanager.backend=DEBUG

# CORS allowed origins (for Docker)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:80,http://localhost:5173}